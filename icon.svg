<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A5D6DB"/>
      <stop offset="100%" stop-color="#7BB8BF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Floating dots -->
  <circle cx="90" cy="80" r="8" fill="#F9E9D9" opacity="0.55"/>
  <circle cx="430" cy="100" r="6" fill="#E8E8C6" opacity="0.65"/>
  <circle cx="80" cy="420" r="7" fill="#F9E9D9" opacity="0.45"/>
  <circle cx="440" cy="430" r="5" fill="#E8E8C6" opacity="0.55"/>

  <g transform="translate(256 270)">
    <!-- Bunny Ears -->
    <ellipse cx="-50" cy="-110" rx="30" ry="65" fill="#FDF4EA" stroke="#FFFFFF" stroke-width="5" transform="rotate(-10 -50 -110)"/>
    <ellipse cx="-50" cy="-110" rx="15" ry="45" fill="#F9E9D9" transform="rotate(-10 -50 -110)"/>
    <ellipse cx="50" cy="-110" rx="30" ry="65" fill="#FDF4EA" stroke="#FFFFFF" stroke-width="5" transform="rotate(10 50 -110)"/>
    <ellipse cx="50" cy="-110" rx="15" ry="45" fill="#F9E9D9" transform="rotate(10 50 -110)"/>

    <!-- Head -->
    <ellipse cx="0" cy="20" rx="110" ry="100" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Cheeks -->
    <circle cx="-60" cy="30" r="22" fill="#F9E9D9" opacity="0.7"/>
    <circle cx="60" cy="30" r="22" fill="#F9E9D9" opacity="0.7"/>

    <!-- Eyes -->
    <ellipse cx="-35" cy="0" rx="12" ry="18" fill="#4D4542"/>
    <circle cx="-31" cy="-6" r="4" fill="#FFFFFF"/>
    <ellipse cx="35" cy="0" rx="12" ry="18" fill="#4D4542"/>
    <circle cx="39" cy="-6" r="4" fill="#FFFFFF"/>

    <!-- Nose -->
    <ellipse cx="0" cy="25" rx="10" ry="8" fill="#E8C9A8"/>

    <!-- Smile -->
    <path d="M-12 38 Q0 48 12 38" fill="none" stroke="#4D4542" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Stars decoration -->
    <text x="-150" y="-140" font-size="28" fill="#F9E9D9" opacity="0.7">✦</text>
    <text x="120" y="-130" font-size="22" fill="#E8E8C6" opacity="0.8">✦</text>
  </g>

  <!-- App name -->
  <text x="256" y="470" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" opacity="0.95">阳光大美妞</text>
</svg>